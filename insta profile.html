<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-centernh">
    <div class="w-[320px] h-[450px] bg-pink-400 rounded-[32px] shadow-2xl flex flex-col justify-between px-5 py-6 border-pink">

      <!-- Top bar -->
      <div class="flex items-center justify-between">
        <button class="w-9 h-9 rounded-full bg-pink-700 text-white flex items-center justify-center">
          <i class="fa-solid fa-chevron-left text-pink-400">></i>
        </button>

        <div class="flex gap-2">
          <button class="w-9 h-9 rounded-full bg-pink-700 text-pink-500 flex items-center justify-center">
            <i class="fa-solid fa-heart">≡</i>
          </button>
          <button class="w-9 h-9 rounded-full bg-pink-700 text-pink-400 flex items-center justify-center">
            <i class="fa-solid fa-bars">></i>
          </button>
        </div>
      </div>

      <!-- Profile -->
      <div class="flex flex-col items-center text-center">

        <!-- avatar: gradient circle > dark circle > photo -->
        <div class="w-24 h-24 rounded-full p-[3px] mb-5 bg-[linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)]">
          <div class="w-full h-full rounded-full bg-[#141416] p-[3px]">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrvJOGp3wd2ZfOzhemOiERvd6dfZ5DSQncxvp_03FaxA&s"
              alt="ALI MAPARI" class="w-full h-full rounded-full object-cover">
          </div>
        </div>

        <h1 class="text-pink-700 text-xl font-semibold mb-3">ALI MAPARI</h1>

        <p class="text-gray-400 text-sm text-pink-700 leading-relaxed px-3 mb-6 max-w-[220px]">
          My name is ALI MAPARI and I learning Web Development
        </p>

        <button class="bg-[#232326] text-pink-700 text-sm font-medium px-8 py-2.5 rounded-full">
          Hire Me
        </button>
      </div>

      <!-- Social icons -->
      <div class="flex justify-around pb-2">

        <div class="w-11 h-11 rounded-full text-white text-xl flex items-center justify-center
                    bg-[radial-gradient(circle_at_30%_107%,#fdf497,#fd5949_45%,#d6249f_60%,#285aeb_90%)]">

</body>
</html>
